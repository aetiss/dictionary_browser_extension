<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Options</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="container">
      <div>
        <img
          class="header-img"
          src="../assets/icon_book_64.png"
          alt="WordWorkshop"
        />
        <div class="header-text">
          WordWorkshop Settings
        </div>
      </div>
      <br />
      <form>
        <label style="font-size: 17px;">Keyboard Shortcut:</label>
        <br />
        <input id="shortcut" type="text" />
        <button id="update" class="btn">Update Keyboard Shortcut</button>
        <button id="reset" class="btn">Reset Keyboard Shortcut</button>
      </form>
      <br />
      <div class="switch-container">
        Choose Theme:
        <label class="radio-container"
          >System
          <input type="radio" id="system-theme" name="theme" value="system" checked="checked" />
          <span class="checkmark"></span>
        </label>
        <label class="radio-container"
          >Light
          <input type="radio" id="light-theme" name="theme" value="light" />
          <span class="checkmark"></span>
        </label>
        <label class="radio-container"
          >Dark
          <input type="radio" id="dark-theme" name="theme" value="dark" />
          <span class="checkmark"></span>
        </label>
      </div>
      <br />
    </div>
    <script src="options.js"></script>
  </body>
</html>
