<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WordWorkshop</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="search-container">
      <input id="search" type="text" placeholder="Type a word..." autofocus />
    </div>
    <div id="result" class="result hidden">
      <div id="stem-notice" class="stem-notice hidden"></div>
      <div class="word-header">
        <span id="keyword" class="keyword"></span>
        <span id="pos" class="pos"></span>
      </div>
      <div id="pronunciation" class="pronunciation hidden">
        <span id="ipa" class="ipa"></span>
        <button id="speak-btn" class="speak-btn" title="Listen to pronunciation" aria-label="Listen to pronunciation">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        </button>
      </div>
      <div id="etymology" class="etymology hidden"></div>
      <div id="text-result" class="text-result"></div>
      <div class="footer">
        <a href="#" id="source-link" target="_blank">Wiktionary</a>
        <a href="#" id="optionsPage" target="_blank">Settings</a>
      </div>
    </div>
    <div id="empty-state" class="empty-state">
      Double-click any word on a page, or type above.
    </div>
    <div id="error-state" class="error-state hidden"></div>
    <script src="util.js"></script>
    <script src="script.js"></script>
  </body>
</html>
