<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dictionary</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="search-container">
      <input id="search" type="text" placeholder="Type a word..." autofocus />
    </div>
    <div id="result" class="result hidden">
      <div class="word-header">
        <span id="keyword" class="keyword"></span>
        <span id="pos" class="pos"></span>
      </div>
      <div id="text-result" class="text-result"></div>
      <div class="footer">
        <a href="#" id="source-link" target="_blank">Wiktionary</a>
        <a href="#" id="optionsPage" target="_blank">Settings</a>
      </div>
    </div>
    <div id="empty-state" class="empty-state">
      Double-click any word on a page, or type above.
    </div>
    <div id="error-state" class="error-state hidden"></div>
    <script src="util.js"></script>
    <script src="script.js"></script>
  </body>
</html>
