name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Run unit tests
        run: node --test tests/background.test.js tests/content.test.js tests/util.test.js tests/prepare-wordset.test.js

      - name: Prepare dictionary data
        run: node scripts/prepare-wordset.js

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright deps (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run E2E tests
        run: npx playwright test tests/e2e.spec.js

  package:
    name: Package & Release
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Prepare dictionary data
        run: node scripts/prepare-wordset.js

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Update manifest version
        run: |
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            m.version = '${{ steps.version.outputs.VERSION }}';
            fs.writeFileSync('manifest.json', JSON.stringify(m, null, 4) + '\n');
          "

      - name: Package extension (Chrome)
        run: |
          mkdir -p dist
          zip -r dist/dictionary-extension-chrome-v${{ steps.version.outputs.VERSION }}.zip \
            manifest.json background.js content.js content.css \
            browserAction/ options/ assets/ data/ \
            -x "*.DS_Store"

      - name: Package extension (Firefox)
        run: |
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            m.background = { scripts: ['background.js'] };
            fs.writeFileSync('manifest.json', JSON.stringify(m, null, 4) + '\n');
          "
          zip -r dist/dictionary-extension-firefox-v${{ steps.version.outputs.VERSION }}.zip \
            manifest.json background.js content.js content.css \
            browserAction/ options/ assets/ data/ \
            -x "*.DS_Store"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-packages-v${{ steps.version.outputs.VERSION }}
          path: dist/
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/dictionary-extension-chrome-v${{ steps.version.outputs.VERSION }}.zip
            dist/dictionary-extension-firefox-v${{ steps.version.outputs.VERSION }}.zip
          body: |
            ## Installation

            ### Chrome
            1. Download `dictionary-extension-chrome-v${{ steps.version.outputs.VERSION }}.zip`
            2. Go to `chrome://extensions` → Enable Developer mode
            3. Drag and drop the zip, or unzip and Load unpacked

            ### Firefox
            1. Download `dictionary-extension-firefox-v${{ steps.version.outputs.VERSION }}.zip`
            2. Or install from [Firefox Add-ons](https://addons.mozilla.org/en-US/firefox/addon/dictionary-browser-extension/)

  publish-firefox:
    name: Publish to Firefox Add-ons
    needs: package
    runs-on: ubuntu-latest
    if: ${{ vars.FIREFOX_PUBLISH_ENABLED == 'true' }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension-packages-v${{ github.ref_name }}
          path: dist/

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Submit to Firefox Add-ons (AMO)
        run: |
          npx web-ext sign \
            --source-dir=. \
            --artifacts-dir=dist/ \
            --api-key="${{ secrets.AMO_API_KEY }}" \
            --api-secret="${{ secrets.AMO_API_SECRET }}" \
            --channel=listed \
            --upload-source-map=dist/dictionary-extension-firefox-v${{ steps.version.outputs.VERSION }}.zip \
          || echo "::warning::Firefox submission failed — upload manually at https://addons.mozilla.org/developers/"

  publish-chrome:
    name: Publish to Chrome Web Store
    needs: package
    runs-on: ubuntu-latest
    if: ${{ vars.CHROME_PUBLISH_ENABLED == 'true' }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension-packages-v${{ github.ref_name }}
          path: dist/

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Upload to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: dist/dictionary-extension-chrome-v${{ steps.version.outputs.VERSION }}.zip
          extension-id: ${{ vars.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true
