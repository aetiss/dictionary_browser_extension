name: Data Release

# Runs when a GitHub release is published (manually or via the Releases UI).
# Builds the full Wiktionary dictionary data and uploads it as a release asset
# so users can run `node scripts/download-data.js` instead of the slow build.
#
# Asset published: dictionary-data.tar.gz (~60 MB)

on:
  release:
    types: [published]

jobs:
  build-and-upload:
    name: Build Wiktionary Data
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write  # needed to upload release assets

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build dictionary data from Wiktionary
        # 4 GB heap is enough after the miniEntry() memory fix.
        # kaikki.org streams ~230 MB; expect 5-15 minutes on GitHub Actions.
        run: node --max-old-space-size=4096 scripts/prepare-wiktionary.js

      - name: Verify output
        run: |
          count=$(ls data/*.json | wc -l)
          echo "Generated $count letter files"
          du -sh data/
          [ "$count" -ge 26 ] || (echo "ERROR: expected at least 26 letter files" && exit 1)

      - name: Bundle data
        run: tar -czf dictionary-data.tar.gz data/

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dictionary-data.tar.gz \
            --clobber
